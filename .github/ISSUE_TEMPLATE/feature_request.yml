name: Feature request
description: Suggest a new mission, option or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. WakeNudge has a few fixed ground rules, so please keep them in mind:
        it stays **offline** (no accounts, analytics or remote services), **a mission must never trap the user**, and anything that changes system state must put it back.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution. For example "I fall back asleep after dismissing" rather than "add X".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How it would work in the app. Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Existing settings or missions that nearly do this, or other apps' approaches you liked (a description is enough).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wake-up missions
        - Alarm sound, volume or vibration
        - Snooze and oversleep protection
        - Scheduling (repeat, holidays, vacation)
        - Alarm Health and reliability
        - Clock tools (timer, stopwatch, world clock)
        - Widgets and Quick Settings tile
        - Design, accessibility or translations
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues for the same idea.
          required: true
        - label: This does not need a network connection, an account or any data leaving the phone.
          required: true
