name: CI and Release

# Every push to main is built, verified, versioned and published as a signed stable GitHub Release (docs/RELEASING.md).
# Pull requests and manual runs only verify. The emulator tests run weekly and on demand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

# Superseded pull request runs are cancelled. Runs for main are never cancelled, so a release that has started always
# finishes; GitHub still lets only one run per group go at a time and keeps the newest one waiting, which is also what
# keeps two releases from racing over the "Latest" mark. The event is part of the key so the weekly schedule can never
# displace a waiting push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An explicit shell turns on `-o pipefail`; the default (`bash -e`) would let `a | tee` hide a failure of `a`.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is derived from the commit count, so debug builds here match what a release would carry.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests (play and github)
        run: ./gradlew :app:testPlayDebugUnitTest :app:testGithubDebugUnitTest --stacktrace

      - name: Lint (play and github)
        run: ./gradlew :app:lintPlayDebug :app:lintGithubDebug --stacktrace

      # The Play bundle must never hold a network permission; the github APK may hold INTERNET and nothing else.
      - name: Verify the network permissions of all four variants
        run: >
          ./gradlew
          :app:verifyOfflineManifestPlayDebug :app:verifyOfflineManifestPlayRelease
          :app:verifyOfflineManifestGithubDebug :app:verifyOfflineManifestGithubRelease
          --stacktrace

      - name: Assemble the debug builds
        run: ./gradlew :app:assemblePlayDebug :app:assembleGithubDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: wakenudge-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          retention-days: 7

  release:
    name: Sign and publish the release
    needs: verify
    # Only pushes to main release, and not in forks (they have no signing key). Put [skip release] in the message of the
    # newest commit of a push to publish nothing.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && github.event.repository.fork == false
      && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit count and the previous tag both need the full history
          persist-credentials: false # the build never sees a git credential; publishing uses GH_TOKEN directly

      # Refuses a tampered gradle-wrapper.jar before it gets to run next to the signing key.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Work out the version
        id: version
        run: scripts/compute-version.sh --strict | tee -a "$GITHUB_OUTPUT"

      # Secrets are only handed to the steps that need them, never to the job as a whole. A stable release is never
      # unsigned or debug-signed, so a missing secret stops the run here instead of producing a lesser artifact.
      - name: Restore and check the signing key
        env:
          WAKENUDGE_KEYSTORE_BASE64: ${{ secrets.WAKENUDGE_KEYSTORE_BASE64 }}
          WAKENUDGE_KEYSTORE_PASSWORD: ${{ secrets.WAKENUDGE_KEYSTORE_PASSWORD }}
          WAKENUDGE_KEY_ALIAS: ${{ secrets.WAKENUDGE_KEY_ALIAS }}
          WAKENUDGE_KEY_PASSWORD: ${{ secrets.WAKENUDGE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in WAKENUDGE_KEYSTORE_BASE64 WAKENUDGE_KEYSTORE_PASSWORD WAKENUDGE_KEY_ALIAS WAKENUDGE_KEY_PASSWORD; do
            [ -n "${!name//[[:space:]]/}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Release signing secrets are missing::Add the repository secret(s): ${missing[*]}. See docs/RELEASING.md. Nothing was built or published."
            exit 1
          fi

          keystore="$RUNNER_TEMP/wakenudge-release.jks"
          (umask 077 && printf '%s' "$WAKENUDGE_KEYSTORE_BASE64" | base64 -d > "$keystore") \
            || { echo "::error title=Invalid keystore secret::WAKENUDGE_KEYSTORE_BASE64 is not valid base64. Create it with: base64 -w0 wakenudge.jks"; exit 1; }

          # Sign a throwaway jar: proves the store password, alias and key password work before the long build starts.
          probe="$RUNNER_TEMP/signing-probe"
          mkdir -p "$probe"
          echo probe > "$probe/probe.txt"
          jar --create --file "$probe/probe.jar" -C "$probe" probe.txt
          signed=true
          jarsigner -keystore "$keystore" -storepass:env WAKENUDGE_KEYSTORE_PASSWORD -keypass:env WAKENUDGE_KEY_PASSWORD \
            "$probe/probe.jar" "$WAKENUDGE_KEY_ALIAS" > /dev/null 2>&1 || signed=false
          rm -rf "$probe"
          if [ "$signed" = false ]; then
            echo "::error title=Signing key unusable::The keystore secret could not sign with the given alias and passwords. Check the four WAKENUDGE_* secrets (docs/RELEASING.md)."
            exit 1
          fi

          echo "WAKENUDGE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build the signed APK (github) and AAB (play)
        env:
          WAKENUDGE_KEYSTORE_PASSWORD: ${{ secrets.WAKENUDGE_KEYSTORE_PASSWORD }}
          WAKENUDGE_KEY_ALIAS: ${{ secrets.WAKENUDGE_KEY_ALIAS }}
          WAKENUDGE_KEY_PASSWORD: ${{ secrets.WAKENUDGE_KEY_PASSWORD }}
          WAKENUDGE_REQUIRE_SIGNING: 'true'
          WAKENUDGE_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          WAKENUDGE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: >
          ./gradlew
          :app:verifyOfflineManifestPlayRelease :app:verifyOfflineManifestGithubRelease
          :app:assembleGithubRelease :app:bundlePlayRelease
          --stacktrace

      - name: Verify the signed artifacts
        id: artifacts
        env:
          WAKENUDGE_KEYSTORE_PASSWORD: ${{ secrets.WAKENUDGE_KEYSTORE_PASSWORD }}
          WAKENUDGE_KEY_ALIAS: ${{ secrets.WAKENUDGE_KEY_ALIAS }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: >
          scripts/verify-release.sh
          --apk app/build/outputs/apk/github/release/app-github-release.apk
          --aab app/build/outputs/bundle/playRelease/app-play-release.aab
          --version-name "$VERSION_NAME"
          --version-code "$VERSION_CODE"

      - name: Stage the release files and notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          CERT_SHA256: ${{ steps.artifacts.outputs.cert_sha256 }}
        run: >
          scripts/stage-release.sh
          --version-name "$VERSION_NAME"
          --cert-sha256 "$CERT_SHA256"
          --apk app/build/outputs/apk/github/release/app-github-release.apk
          --aab app/build/outputs/bundle/playRelease/app-play-release.aab
          --mapping-play app/build/outputs/mapping/playRelease/mapping.txt
          --mapping-github app/build/outputs/mapping/githubRelease/mapping.txt
          --out build/release-dist
          --notes-file build/release-notes.md

      # Kept on the run as well, so the files survive even if publishing fails after this point.
      - name: Upload the release files
        uses: actions/upload-artifact@v4
        with:
          name: wakenudge-release-${{ steps.version.outputs.version_name }}
          path: build/release-dist/
          retention-days: 14

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CERT_SHA256: ${{ steps.artifacts.outputs.cert_sha256 }}
        run: |
          flags=()
          # .github/release.yml, when present, sorts GitHub's own generated notes into categories.
          if [ -f .github/release.yml ]; then flags+=(--generate-notes); fi
          scripts/publish-release.sh \
            --version-name "$VERSION_NAME" \
            --dist build/release-dist \
            --notes-file build/release-notes.md \
            "${flags[@]}"
          {
            echo "### WakeNudge $VERSION_NAME"
            echo
            echo "Version code $VERSION_CODE, signing certificate SHA-256 \`$CERT_SHA256\`."
            echo "Upload \`WakeNudge-$VERSION_NAME.aab\` to Google Play (docs/RELEASING.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wakenudge-release.jks"
        # The runner is thrown away after the job; this keeps the key off the disk for the rest of it too.

  # Instrumented tests need an emulator. They are slow, so they run on demand and on a schedule rather than per push.
  instrumented:
    name: Instrumented tests (emulator)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedPlayDebugAndroidTest --stacktrace
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
