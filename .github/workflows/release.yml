name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Verify before releasing
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:verifyOfflineManifestRelease --stacktrace

      # Provide WAKENUDGE_KEYSTORE_BASE64, WAKENUDGE_KEYSTORE_PASSWORD, WAKENUDGE_KEY_ALIAS and WAKENUDGE_KEY_PASSWORD as repository secrets.
      # Without them the build still succeeds but the artifacts are unsigned.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WAKENUDGE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wakenudge.jks"
            echo "WAKENUDGE_KEYSTORE_PATH=$RUNNER_TEMP/wakenudge.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key configured; building unsigned artifacts."
          fi

      - name: Build APK and bundle
        env:
          WAKENUDGE_KEYSTORE_PASSWORD: ${{ secrets.WAKENUDGE_KEYSTORE_PASSWORD }}
          WAKENUDGE_KEY_ALIAS: ${{ secrets.WAKENUDGE_KEY_ALIAS }}
          WAKENUDGE_KEY_PASSWORD: ${{ secrets.WAKENUDGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cp app/build/outputs/bundle/release/*.aab dist/
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wakenudge-release
          path: dist/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
